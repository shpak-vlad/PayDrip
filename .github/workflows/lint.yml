name: Lint

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  solhint:
    name: Solidity Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.8.1 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-git
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@v5.0.2 --no-git

      - name: Format code
        working-directory: contracts
        run: forge fmt

      - name: Run Slither (if available)
        working-directory: contracts
        continue-on-error: true
        run: |
          pip3 install slither-analyzer
          slither . || echo "Slither analysis completed with warnings"
