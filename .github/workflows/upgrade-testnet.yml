name: Upgrade to V2 (Testnet)

on:
  workflow_dispatch:
    inputs:
      proxy_address:
        description: 'Proxy Address'
        required: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      
      - name: Install dependencies
        run: |
          cd contracts
          forge install foundry-rs/forge-std@v1.8.1 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-git
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@v5.0.2 --no-git
      
      - name: Build contracts
        run: |
          cd contracts
          forge build --force
      
      - name: Upgrade
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          PROXY_ADDRESS: ${{ inputs.proxy_address }}
        run: |
          cd contracts
          forge script script/UpgradeToV2.s.sol \
            --rpc-url https://sepolia.base.org \
            --private-key $PRIVATE_KEY \
            --broadcast \
            --verify \
            --etherscan-api-key $BASESCAN_API_KEY \
            -vvvv
