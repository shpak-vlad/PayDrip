name: Deploy to Base Mainnet

on:
  workflow_dispatch:
    inputs:
      verify:
        description: 'Verify on Basescan'
        type: boolean
        default: true
      confirm:
        description: 'Type DEPLOY to confirm mainnet deployment'
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "❌ Deployment cancelled. You must type DEPLOY to confirm."
            exit 1
          fi
          echo "✅ Confirmation received. Proceeding with mainnet deployment..."
      
      - uses: actions/checkout@v4
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      
      - name: Install dependencies
        run: |
          cd contracts
          forge install foundry-rs/forge-std@v1.8.1 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-git
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@v5.0.2 --no-git
      
      - name: Build contracts
        run: |
          cd contracts
          forge build --force
      
      - name: Run tests
        run: |
          cd contracts
          forge test -vv
      
      - name: Deploy to Base Mainnet
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
        run: |
          cd contracts
          echo "🚀 Deploying to Base Mainnet..."
          forge script script/Deploy.s.sol \
            --rpc-url https://mainnet.base.org \
            --private-key $PRIVATE_KEY \
            --broadcast \
            ${{ inputs.verify && '--verify --etherscan-api-key $BASESCAN_API_KEY' || '' }} \
            -vvvv
      
      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-deployment
          path: contracts/broadcast/
      
      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment to Base Mainnet completed successfully!"
          echo "📋 Check the artifacts for contract addresses and transaction details."
