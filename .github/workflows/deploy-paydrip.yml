name: Deploy PayDrip

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network'
        required: true
        type: choice
        options:
          - base-sepolia
          - base-mainnet
      verify:
        description: 'Verify on Basescan'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: |
          cd contracts
          forge install

      - name: Build contracts
        run: |
          cd contracts
          forge build --force

      - name: Deploy PayDrip
        env:
          PRIVATE_KEY: ${{ inputs.network == 'base-mainnet' && secrets.PRIVATE_KEY_MAINNET || secrets.PRIVATE_KEY }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
        run: |
          cd contracts
          RPC_URL=${{ inputs.network == 'base-mainnet' && 'https://mainnet.base.org' || 'https://sepolia.base.org' }}
          CHAIN_ID=${{ inputs.network == 'base-mainnet' && '8453' || '84532' }}

          forge script script/DeployPayDrip.s.sol \
            --rpc-url $RPC_URL \
            --private-key $PRIVATE_KEY \
            --broadcast \
            ${{ inputs.verify && '--verify --etherscan-api-key $BASESCAN_API_KEY' || '' }} \
            -vvvv

      - name: Save deployment
        run: |
          cd contracts
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CHAIN_ID=${{ inputs.network == 'base-mainnet' && '8453' || '84532' }}

          BROADCAST_FILE="broadcast/DeployPayDrip.s.sol/$CHAIN_ID/run-latest.json"

          if [ -f "$BROADCAST_FILE" ]; then
            IMPL=$(jq -r '.transactions[] | select(.contractName == "PayDrip") | .contractAddress' $BROADCAST_FILE | head -1)
            PROXY=$(jq -r '.transactions[] | select(.contractName == "PaymentStreamProxy") | .contractAddress' $BROADCAST_FILE | head -1)
            DEPLOYER=$(jq -r '.transactions[0].transaction.from' $BROADCAST_FILE)

            mkdir -p deployments

            cat > deployments/${{ inputs.network }}.json <<EOF
          {
            "network": "${{ inputs.network }}",
            "chainId": $CHAIN_ID,
            "contracts": {
              "PayDrip": {
                "implementation": "$IMPL",
                "proxy": "$PROXY"
              }
            },
            "deployer": "$DEPLOYER",
            "timestamp": "$TIMESTAMP",
            "version": "v1"
          }
          EOF

            echo "Deployment saved to deployments/${{ inputs.network }}.json"
            cat deployments/${{ inputs.network }}.json
          fi

      - name: Commit deployment
        run: |
          git config user.name "shpak-vlad"
          git config user.email "shpakvladislavv@outlook.com"
          git add contracts/deployments/${{ inputs.network }}.json
          git commit -m "deploy: PayDrip V1 to ${{ inputs.network }}" || echo "No changes"
          git push origin dev || echo "Push failed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paydrip-${{ inputs.network }}-deployment
          path: |
            contracts/broadcast/
            contracts/deployments/${{ inputs.network }}.json
