name: Deploy PayDrip to Base Mainnet

on:
  workflow_dispatch:
    inputs:
      verify:
        description: 'Verify on Basescan'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: |
          cd contracts
          forge install

      - name: Build contracts
        run: |
          cd contracts
          forge build --force

      - name: Deploy PayDrip
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY_MAINNET }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
        run: |
          cd contracts
          forge script script/DeployPayDrip.s.sol \
            --rpc-url https://mainnet.base.org \
            --private-key $PRIVATE_KEY \
            --broadcast \
            ${{ inputs.verify && '--verify --etherscan-api-key $BASESCAN_API_KEY' || '' }} \
            -vvvv

      - name: Save deployment metadata
        run: |
          cd contracts
          mkdir -p deployments
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DEPLOYER=$(cast wallet address ${{ secrets.PRIVATE_KEY_MAINNET }})

          if [ -f broadcast/DeployPayDrip.s.sol/8453/run-latest.json ]; then
            IMPL=$(jq -r '.transactions[] | select(.contractName == "PayDrip") | .contractAddress' broadcast/DeployPayDrip.s.sol/8453/run-latest.json | head -1)
            PROXY=$(jq -r '.transactions[] | select(.contractName == "PaymentStreamProxy") | .contractAddress' broadcast/DeployPayDrip.s.sol/8453/run-latest.json | head -1)

            cat > deployments/paydrip-mainnet.json <<EOF
          {
            "network": "base-mainnet",
            "chainId": 8453,
            "implementation": "$IMPL",
            "proxy": "$PROXY",
            "deployer": "$DEPLOYER",
            "timestamp": "$TIMESTAMP"
          }
          EOF
          fi

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paydrip-mainnet-deployment
          path: |
            contracts/broadcast/
            contracts/deployments/paydrip-mainnet.json
